server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:jpe?g|png|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
